[package]
name = "PDF-Presenter"
version = "0.1.0"
edition = "2024"
description = "Dual-screen PDF presentation app"

[lib]
name = "pdf_presenter"
path = "src/lib.rs"

[[bin]]
name = "decklight"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
lopdf = "0.38"
lru = "0.16"
pdfium-auto = "0.3"
pdfium-render = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.packager]
product-name = "Decklight"
identifier = "com.decklight.app"
publisher = "Decklight"
description = "Dual-screen PDF presentation app"
long-description = """
Decklight is a dual-screen PDF presentation app written in Rust. It provides
presenter and projector views together with annotation and timing tools.
"""
category = "Productivity"
icons = ["assets/icons/*.png"]
before-packaging-command = "cargo build --release --bin decklight"
out-dir = "dist"
binaries-dir = "target/release"

[[package.metadata.packager.binaries]]
path = "decklight"
main = true

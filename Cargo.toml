[package]
name = "PDF-Presenter"
version = "0.1.7"
edition = "2024"
description = "Dual-screen PDF presentation app"

[lib]
name = "pdf_presenter"
path = "src/lib.rs"

[[bin]]
name = "decklight"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.17"
directories = "6.0"
eframe = { version = "0.37.0", default-features = true }
egui = "0.37.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
lru = "0.18.5"
pdfium-render = {
    version = "=0.9.4",
    default-features = false,
    features = ["pdfium_7881", "image_latest", "thread_safe"],
}
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.packager]
product-name = "Decklight"
identifier = "com.decklight.app"
publisher = "Decklight"
description = "Dual-screen PDF presentation app"
long-description = """
Decklight is a dual-screen PDF presentation app written in Rust. It provides
presenter and projector views together with annotation and timing tools.
"""
category = "Productivity"
icons = ["assets/icons/*.png"]
before-packaging-command = "cargo build --release --bin decklight"
out-dir = "dist"
binaries-dir = "target/release"

[[package.metadata.packager.binaries]]
path = "decklight"
main = true

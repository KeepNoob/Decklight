name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            format: appimage
            artifact_glob: dist/*.AppImage
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            format: appimage
            artifact_glob: dist/*.AppImage
          - os: windows-latest
            name: windows-x86_64
            format: nsis
            artifact_glob: dist/*.exe
          - os: macos-26-intel
            name: macos-x86_64
            format: dmg
            artifact_glob: dist/*.dmg
          - os: macos-26
            name: macos-aarch64
            format: dmg
            artifact_glob: dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify
        run: cargo test --locked

      - name: Install Linux Packaging Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fakeroot

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package Application
        run: cargo packager --release --formats ${{ matrix.format }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: decklight-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          overwrite_files: true
